# Merged on top of Harbor's base compose config. `main` is the agent's
# container; `chess-arena` holds the authoritative game state, the opponent
# engine and the hidden per-move evaluations. Under Harbor's egress control
# both containers share one network namespace, so the arena is reachable from
# `main` at http://127.0.0.1:8000 (and as http://chess-arena:8000 otherwise).
services:
  main:
    depends_on:
      chess-arena:
        condition: service_healthy

  chess-arena:
    build:
      context: ./chess-arena
    environment:
      # Shared secret between the arena and the verifier (tests/verify.py).
      # Neither this file nor tests/ is visible to the agent during its run.
      ARENA_ADMIN_TOKEN: "0d4880cefe6f85f4b402504fe426f31e6c7367a476440873"
      ARENA_SEED: "gauntlet-2026"
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
